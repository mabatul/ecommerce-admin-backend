# Starts this backend on its own; reaches LocalStack via the host
# (host.docker.internal). extra_hosts is only needed on native Linux.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-admin-backend
    environment:
      - ENVIRONMENT=local
      - PROJECT_NAME=${PROJECT_NAME:-ecommerce-admin}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://host.docker.internal:4566}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules
      - backend-next-cache:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend-node-modules:
  backend-next-cache:
